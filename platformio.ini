; ==========================================================
; DECKTRACK - PlatformIO project
; ESP32-S3 + 2.8" ST7789 TFT (320 x 240 landscape)
; ==========================================================
; The TFT settings live here (build_flags), so you do NOT edit
; the TFT_eSPI library's User_Setup.h in PlatformIO.
;
; CHANGE THE PIN NUMBERS below to the ESP32-S3 pins your TFT is
; really wired to. The numbers shown are examples.
; ==========================================================

[env:esp32s3]
; Pinned to a platform that uses Arduino-ESP32 2.0.x, which TFT_eSPI
; works with most reliably.
platform = espressif32 @ 6.9.0
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    bblanchon/ArduinoJson @ ^7.2.1

build_flags =
    ; Use these settings instead of the library's User_Setup.h
    -D USER_SETUP_LOADED=1

    ; Display
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320

    ; Pins (EXAMPLES - change to your wiring)
    ; MISO: ST7789 modules usually have no MISO/SDO pin, so -1
    -D TFT_MISO=-1
    ; MOSI: module pin SDA / SDI / MOSI
    -D TFT_MOSI=11
    ; SCLK: module pin SCL / SCK
    -D TFT_SCLK=12
    ; CS: module pin CS (use -1 if the module has no CS pin)
    -D TFT_CS=10
    ; DC: module pin DC / RS
    -D TFT_DC=9
    ; RST: module pin RES (use -1 if tied to the board's RST or 3.3V)
    -D TFT_RST=8
    ; Backlight on a GPIO? Uncomment these two lines and set the pin:
    ; -D TFT_BL=7
    ; -D TFT_BACKLIGHT_ON=HIGH

    ; Fonts used by DECKTRACK
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1

    ; SPI speed
    -D SPI_FREQUENCY=40000000

    ; Only if the picture looks wrong (try ONE at a time)
    ; Red and blue swapped:
    ; -D TFT_RGB_ORDER=TFT_BGR
    ; Colors inverted:
    ; -D TFT_INVERSION_ON=1

    ; Serial Monitor over the board's native USB port (the one labeled USB):
    ; uncomment this. If you use the UART/COM port, leave it off.
    ; -D ARDUINO_USB_CDC_ON_BOOT=1
